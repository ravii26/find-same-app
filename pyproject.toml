# pyproject.toml
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rogue-app-discovery"
version = "0.1.0"
description = "Asynchronous Lookalike / Rogue App Discovery Service"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",

    # Validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",

    # Task queue — Dramatiq 2.2.1 + redis-py 8.x compatibility confirmed
    "dramatiq[redis]==2.2.1",
    "redis==8.1.0",
    "hiredis==3.1.0",

    # HTTP client
    "httpx==0.28.1",

    # HTML parsing — selectolax 1.0.1 uses Lexbor backend only
    "selectolax==1.0.1",

    # Fuzzy matching — requires Python >=3.11
    "rapidfuzz==3.14.6",

    # Jaro-Winkler / Levenshtein for domain lookalike detection
    "jellyfish>=1.0.0",

    # Perceptual hash for icon similarity comparison
    "imagehash>=4.3.0",
    "Pillow>=10.0.0",

    # Google Play Store scraper (no API key or Playwright required)
    "google-play-scraper>=1.2.0",

    # Domain / URL tools
    "tldextract==5.1.3",

    # ULID
    "python-ulid==4.0.1",

    # File utilities
    "filelock==3.16.1",

    # Charset detection
    "chardet==5.2.0",

    # Elasticsearch mirror of scan results (8.x client; async via aiohttp)
    "elasticsearch[async]>=8.15,<9",

    # YAML config
    "pyyaml==6.0.2",

    # Security
    "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-httpx==0.35.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-pyyaml==6.0.12.20240917",
    "fakeredis[lua]==2.26.1",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
]
playwright = [
    "playwright==1.49.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "RUF"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "live: live network tests (deselect with '-m not live')",
    "integration: integration tests requiring Redis",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/config/*"]

[tool.coverage.report]
fail_under = 85
