# config/scoring.yaml
# Scoring ruleset — weights and thresholds for relevance scoring.
# Increment ruleset_version whenever weights or signals change.
ruleset_version: "v12"

weights:
  # Name / title similarity (rapidfuzz ratio on homoglyph-folded strings)
  name_similarity: 0.30
  # Package ID similarity (rapidfuzz on normalized package strings)
  package_similarity: 0.25
  # Domain similarity (registrable domain comparison)
  domain_similarity: 0.15
  # Publisher name fuzzy match against brand_name
  publisher_match: 0.10
  # Found on a known APK hosting site
  apk_site_host: 0.08

thresholds:
  # Minimum score to include in results.
  # Set to 35 so brand-absent results (capped at 34) are automatically excluded.
  min_relevance: 35
  # Higher bar for noisy source groups (social, web_search) to reduce false positives.
  min_relevance_noisy: 40
  # Score at or above which a result is flagged "high risk"
  high_risk: 70

signals:
  # Bonus points for specific pattern matches (additive, capped at 100)
  # Scam vocabulary (rewards, kyc, update, points...) next to an exact/fuzzy brand match
  scam_lure_keyword: 6
  # Brand name used in a subdomain of web.app / herokuapp.com / pages.dev / github.io ...
  brand_on_free_hosting: 10
  # Captured lookalike-domain page: brand + lure wording is boosted; a page that mentions the brand is kept as is.
  # Parked / blank / neutral / unreachable pages show nothing suspicious (a domain existing in DNS is not abuse;
  # brands register .co/.mx/.in defensively) and are capped. Must be one below min_relevance so they are excluded.
  brand_bait_page: 15
  unsuspicious_page_cap: 34
  # Utility/companion app ('Status Saver for WhatsApp', stickers): not an impersonation
  companion_app_penalty: 15
  lure_keyword_in_title: 5             # "mod", "cracked", "premium", "free"
  domain_has_brand_plus_keyword: 6     # petpooja-apk.com
  tld_swap: 4                          # petpooja.net vs petpooja.com
  package_id_suffix_variation: 5       # com.sbi.yonobd.fake vs com.sbi.yonobd (shared id, suffixed)
  # Domain Jaro-Winkler lookalike (catches homoglyph/subtle substitution attacks)
  domain_jw_lookalike: 12              # multiplied by jw_sim (0.85–1.0)
  # pHash icon similarity vs official app icon
  icon_phash_similar: 10               # similarity >= 0.80
  icon_phash_identical: 20             # similarity >= 0.95 (near-pixel-perfect clone)
  # Permission similarity vs official app (auto-fetched from Play Store via android_package)
  # Jaccard >= 0.85 adds no points on its own (a shared permission list alone is not a copy)
  permission_similarity_medium: 8      # Jaccard >= 0.60 — significant overlap
  # excess_dangerous: min(10, count * 2) — computed inline, not a fixed signal
  # Non-official listing with near-exact brand name on an official store
  official_store_name_clone: 15
  # Brand-absent cap: hits with no brand token in name/package/publisher are capped here.
  # Must be one below min_relevance so capped hits are automatically excluded.
  no_brand_presence_cap: 34
  # Approximate-only brand match (e.g. PhonePay for PhonePe): ranked below exact matches
  fuzzy_brand_cap: 59
  # Approximate match corroborated by only two fields (name + package): low confidence
  fuzzy_weak_brand_cap: 44
  # The official app id on a third-party site without the brand's publisher: most likely a mirror of the real app.
  # Kept for review (the signing certificate is not checked) but ranked under high_risk.
  unverified_official_copy_cap: 55
  # A code repository that names itself the brand's APK, or a fake/clone of it ("Fake-PhonePe-APK"): raised to this
  # score (high risk). Repos that only mention the brand are not raised.
  brand_repo_floor: 70